[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpal"
version = "0.1.0"
description = "Security Threat Digest for a Friend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "feedparser>=6.0.10",
    "ollama>=0.1.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "google-search-results>=2.4.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.11.1",
    "ruff>=0.1.0",
    "pyright>=1.1.300"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
